<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Aurabot 语音</title>
<style>
  :root { --fg:#eef3ff; --dim:#9fb0c9; --accent:#4f8cff; --ok:#3ddc84; --danger:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:transparent; font:13px/1.5 "Microsoft YaHei",system-ui,sans-serif; color:var(--fg); overflow:hidden; }
  #card {
    height:100%; display:flex; flex-direction:column; border-radius:16px; overflow:hidden;
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    position:relative;
    background:linear-gradient(180deg,#070d1c 0%,#0a1326 55%,#0b1626 100%);
  }
  /* 房间层：缓慢视差，别让画面死板 */
  #room {
    position:absolute; left:0; right:0; top:34px; height:340px;
    overflow:hidden; z-index:0;
  }
  #room svg { width:100%; height:100%; display:block; }
  .roomImg { width:100%; height:100%; object-fit:cover; display:block; }
  #room .roomWrap {
    position:relative; z-index:1;
    width:100%; height:100%;
    animation: roomDrift 34s ease-in-out infinite alternate;
    will-change: transform;
  }

  /* 舞台底部往日志区过渡，别硬切 */
  #roomFade {
    position:absolute; left:0; right:0; bottom:0; height:48px; z-index:6;
    background:linear-gradient(180deg, rgba(8,14,26,0) 0%, rgba(8,14,26,.85) 100%);
  }
  @keyframes roomDrift {
    from { transform: scale(1.17) translate3d(-0.6%, 0.3%, 0); }
    to   { transform: scale(1.21) translate3d(0.6%, -0.5%, 0); }
  }
  #bar, #stage, #log, #foot { position:relative; z-index:1; }
  /* ===== 氛围特效（默认关，body 上加 fx-xxx 才生效） ===== */
  .flake { opacity: 0; }
  @keyframes snowFall {
    0%   { transform: translateY(-8px); opacity: 0; }
    12%  { opacity: .95; }
    100% { transform: translateY(150px); opacity: 0; }
  }
  body.fx-snow .flake {
    opacity: .9;
    animation-name: snowFall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes lampBreath { 0%,100% { opacity:.5 } 50% { opacity:1 } }
  body.fx-lamp #lampGlow { animation: lampBreath 3.4s ease-in-out infinite; }
  body.fx-lamp #bedGlow  { animation: lampBreath 4.1s ease-in-out infinite .6s; }
  @keyframes rugFlow { to { stroke-dashoffset: -260; } }
  body.fx-rug #rugRing { animation: rugFlow 16s linear infinite; }

  /* ===== 叠加特效（贴着 AI 图上的位置） ===== */
  #fxSnow {
    position:absolute; overflow:hidden; pointer-events:none; z-index:5;
    left:54%; top:4%; width:41%; height:38%;
  }
  .flake {
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:#ffffff; box-shadow:0 0 6px #dff0ff, 0 0 2px #ffffff; opacity:0;
  }
  body.fx-snow .flake { animation-name: snowFall; animation-timing-function: linear; animation-iteration-count: infinite; }

  .fxGlow {
    position:absolute; pointer-events:none; border-radius:50%; z-index:5;
    background: radial-gradient(circle, rgba(255,206,130,.85) 0%, rgba(255,196,110,.42) 38%, rgba(255,190,100,0) 72%);
    opacity:0;
  }
  body.fx-lamp #fxLampA { animation: lampBreath 3.4s ease-in-out infinite; }
  body.fx-lamp #fxLampB { animation: lampBreath 4.2s ease-in-out infinite .7s; }
  @keyframes lampBreath { 0%,100% { opacity:.28 } 50% { opacity:.85 } }

  #fxRug {
    position:absolute; pointer-events:none; border-radius:50%; z-index:4;
    background: radial-gradient(circle, rgba(150,210,240,.32) 0%, rgba(150,210,240,.10) 55%, rgba(150,210,240,0) 72%);
    opacity:0;
  }
  body.fx-rug #fxRug { animation: rugPulse 7s ease-in-out infinite; }
  @keyframes rugPulse { 0%,100% { opacity:.12; transform:scale(1) } 50% { opacity:.55; transform:scale(1.03) } }

  /* 灯罩本体闪烁（不规则，像真实灯泡） */
  .fxShade {
    position:absolute; pointer-events:none; border-radius:50%; z-index:5;
    background: radial-gradient(circle, rgba(255,244,214,.95) 0%, rgba(255,214,150,.6) 42%, rgba(255,200,130,0) 72%);
    opacity:0; mix-blend-mode:screen;
  }
  body.fx-lamp .fxShade { animation: shadeFlicker 3.1s steps(1,end) infinite; }
  @keyframes shadeFlicker {
    0%   { opacity:.35 }
    7%   { opacity:1 }
    11%  { opacity:.45 }
    19%  { opacity:.95 }
    27%  { opacity:.6 }
    38%  { opacity:1 }
    52%  { opacity:.4 }
    68%  { opacity:.9 }
    74%  { opacity:.55 }
    88%  { opacity:.95 }
    100% { opacity:.35 }
  }

  /* 整屋暖光层（跟着灯一起呼吸） */
  #fxWarm {
    position:absolute; inset:0; pointer-events:none; z-index:3;
    background: radial-gradient(ellipse at 50% 42%, rgba(255,198,128,.26) 0%, rgba(255,188,118,.10) 45%, rgba(255,180,110,0) 72%);
    opacity:0;
  }
  body.fx-lamp #fxWarm { animation: warmPulse 4.6s ease-in-out infinite; }
  @keyframes warmPulse { 0%,100% { opacity:.2 } 50% { opacity:.8 } }

  body.room-day .fxShade, body.room-day #fxWarm { display:none; }
  body.room-day #fxSnow { display:none; }

  /* ===== 调试模式 ===== */
  #calGrid {
    position:absolute; inset:0; z-index:9; display:none; pointer-events:none;
    background-image:
      repeating-linear-gradient(to right, rgba(255,90,90,.30) 0 1px, transparent 1px 10%),
      repeating-linear-gradient(to bottom, rgba(255,90,90,.30) 0 1px, transparent 1px 10%),
      repeating-linear-gradient(to right, rgba(90,200,255,.45) 0 1px, transparent 1px 50%);
  }
  body.fx-cal #calGrid { display:block; }
  body.fx-cal #fxSnow,
  body.fx-cal .fxGlow,
  body.fx-cal .fxShade,
  body.fx-cal #fxRug,
  body.fx-cal #fxWarm {
    outline:2px dashed rgba(255,80,80,.95) !important;
    background-color: rgba(255,0,0,.08) !important;
    opacity:1 !important;
  }
  body.fx-cal #fxSnow,
  body.fx-cal .fxGlow,
  body.fx-cal .fxShade,
  body.fx-cal #fxRug { pointer-events:auto !important; cursor:move; user-select:none; touch-action:none; }
  body.fx-cal #fxSnow { outline-color:#5ad2ff !important; }
  body.fx-cal #fxRug { outline-color:#ffe14d !important; }
  body.fx-cal .fxShade { outline-color:#ff9f43 !important; }
  #calInfo {
    position:absolute; left:6px; right:6px; bottom:6px; z-index:10; display:none;
    font:11px/1.35 ui-monospace,Consolas,monospace; color:#fff;
    background:rgba(0,0,0,.66); border-radius:8px; padding:6px 8px; white-space:pre-wrap;
  }
  body.fx-cal #calInfo { display:block; }

  /* ===== 物体标注层 ===== */
  #objLayer { position:absolute; inset:0; z-index:8; pointer-events:none; display:none; }
  body.fx-cal #objLayer { display:block; }
  .objBox {
    position:absolute; border:1px solid rgba(120,255,170,.95); background:rgba(120,255,170,.10);
    pointer-events:auto; cursor:move; box-sizing:border-box;
  }
  .objBox .lbl {
    position:absolute; left:-1px; top:-15px; font:10px/1.4 ui-monospace,Consolas,monospace;
    color:#bfffd8; background:rgba(0,0,0,.65); padding:0 4px; border-radius:3px; white-space:nowrap;
  }
  .objAnchor {
    position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%;
    border:2px solid #ffd166; background:rgba(255,209,102,.30);
    pointer-events:auto; cursor:crosshair; z-index:2;
  }
  .objAnchor::before, .objAnchor::after { content:''; position:absolute; background:rgba(255,209,102,.95); }
  .objAnchor::before { left:50%; top:-5px; width:1px; height:20px; }
  .objAnchor::after { top:50%; left:-5px; height:1px; width:20px; }

  /* 特效开关按钮 */
  #fx { position:absolute; right:8px; top:42px; display:flex; gap:5px; z-index:3; }
  .fx-btn {
    -webkit-app-region:no-drag; cursor:pointer; font-size:11px; padding:3px 7px; border-radius:8px;
    background:rgba(10,18,32,.55); color:var(--dim);
    border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(3px);
  }
  .fx-btn:hover { background:rgba(20,32,52,.75); color:var(--fg); }
  .fx-btn.on { background:rgba(79,140,255,.30); border-color:rgba(79,140,255,.6); color:#dce9ff; }

  #bar { -webkit-app-region:drag; display:flex; align-items:center; gap:6px; padding:8px 10px; background:rgba(255,255,255,.05); }
  #bar .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); }
  #bar .title { flex:1; font-size:12px; color:var(--dim); }
  #bar button {
    -webkit-app-region:no-drag; width:22px; height:22px; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    border:none; border-radius:6px; background:rgba(255,255,255,.08); color:var(--fg); cursor:pointer;
    line-height:1;
  }
  #bar button svg { display:block; }
  #bar button:hover { background:rgba(255,255,255,.18); }
  #bar button#btnTop { color:rgba(238,243,255,.55); }
  #bar button#btnTop.on { background:rgba(79,140,255,.45); box-shadow:0 0 0 1px rgba(79,140,255,.7) inset; color:#ffffff; }
  #bar button#btnTop:hover { color:#ffffff; }

  #stage { position:relative; height:340px; background:transparent; display:flex; align-items:flex-end; justify-content:center; }
  #pet { height:260px; width:260px; transform:translateX(22px); object-fit:contain; }
  #stageFallback { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:52px; opacity:.5; }
  #state { position:absolute; left:10px; bottom:6px; font-size:11px; color:var(--dim); }
  #level { position:absolute; right:10px; bottom:8px; width:60px; height:4px; border-radius:2px; background:rgba(255,255,255,.12); overflow:hidden; opacity:0; transition:opacity .2s; }
  #level.on { opacity:1; }
  #level i { display:block; height:100%; width:0%; background:var(--ok); transition:width .06s linear; }

  #log { flex:1; overflow-y:auto; padding:14px 10px 8px; background:linear-gradient(180deg, rgba(8,14,26,0) 0%, rgba(8,14,26,.72) 14%, rgba(8,14,26,.88) 100%); display:flex; flex-direction:column; gap:6px; }
  #log::-webkit-scrollbar { width:6px; }
  #log::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:3px; }
  .row { max-width:86%; padding:6px 9px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
  .me { align-self:flex-end; background:rgba(79,140,255,.28); border:1px solid rgba(79,140,255,.35); }
  .her { align-self:flex-start; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.10); }
  .sys { align-self:center; font-size:11px; color:var(--dim); background:none; }

  #foot { padding:8px 10px 10px; display:flex; flex-direction:column; gap:6px; background:rgba(8,14,26,.35); }
  #ptt {
    height:42px; border-radius:12px; border:1px solid rgba(255,255,255,.14);
    background:linear-gradient(180deg,rgba(79,140,255,.35),rgba(79,140,255,.18));
    color:var(--fg); font-size:14px; cursor:pointer; user-select:none; -webkit-user-select:none;
    touch-action:none; transition:transform .06s, background .12s;
  }
  #ptt:active, #ptt.rec { transform:scale(.985); background:linear-gradient(180deg,rgba(255,107,107,.5),rgba(255,107,107,.25)); border-color:rgba(255,107,107,.5); }
  #ptt:disabled { opacity:.35; cursor:default; }

  #listen {
    height:32px; border-radius:10px; border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06); color:var(--dim); font-size:12.5px; cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  #listen:hover { background:rgba(255,255,255,.12); }
  #listen.on { background:rgba(61,220,132,.20); border-color:rgba(61,220,132,.55); color:#c8ffe0; }
  #listen.hearing { animation:pulse .9s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(61,220,132,.35); } 50% { box-shadow:0 0 0 6px rgba(61,220,132,0); } }

  #hint { font-size:11px; color:var(--dim); text-align:center; min-height:16px; }

  /* 右键动作菜单 */
  #menu {
    position:absolute; z-index:50; display:none; flex-direction:column;
    width:262px; max-height:300px; border-radius:12px; overflow:hidden;
    background:rgba(22,27,38,.98); border:1px solid rgba(255,255,255,.14);
    box-shadow:0 12px 32px rgba(0,0,0,.5);
  }
  #menu.open { display:flex; }
  #menuSearch {
    border:none; outline:none; padding:8px 10px; font-size:12.5px;
    background:rgba(255,255,255,.06); color:var(--fg);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  #menuList { overflow-y:auto; padding:4px; }
  #menuList::-webkit-scrollbar { width:6px; }
  #menuList::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); border-radius:3px; }
  .mi {
    padding:6px 9px; border-radius:7px; font-size:12.5px; cursor:pointer;
    display:flex; justify-content:space-between; gap:8px; white-space:nowrap;
  }
  .mi:hover { background:rgba(79,140,255,.28); }
  .mi .id { color:var(--dim); font-size:11px; }
  .empty { padding:10px; font-size:12px; color:var(--dim); text-align:center; }
</style>
</head>
<body class="fx-snow fx-lamp fx-rug">
<div id="card">
  <div id="room">
  <div id="fxWarm"></div>
  <div id="fxSnow"></div>
  <div id="fxLampA" class="fxGlow"></div>
  <div id="fxLampB" class="fxGlow"></div>
  <div id="fxShadeA" class="fxShade"></div>
  <div id="fxShadeB" class="fxShade"></div>
  <div id="fxRug"></div>
  <div class="roomWrap"><img id="roomImg" class="roomImg" src="rooms/v2-blue-cozy.webp" alt=""></div>
  <div id="objLayer"></div>
  <div id="roomFade"></div>
  <div id="calGrid"></div>
  <div id="calInfo"></div>
</div>

  <div id="bar">
    <span class="dot"></span>
    <span class="title">大肥鱼 · 语音对话</span>
    <button id="btnTop" title="置顶（当前：开）" aria-label="置顶">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3.5h6"/>
        <path d="M10.5 3.5v6.2L8 13.2h8l-2.5-3.5V3.5"/>
        <path d="M12 13.2V20.5"/>
      </svg>
    </button>
    <button id="btnMin" title="最小化">–</button>
    <button id="btnClose" title="关闭">×</button>
  </div>

  <div id="fx">
    <button class="fx-btn" data-fx="snow" title="窗外飘雪">❄ 雪</button>
    <button class="fx-btn" data-fx="lamp" title="台灯呼吸">💡 灯</button>
    <button class="fx-btn" data-fx="rug" title="地毯流光">✨ 毯</button>
    <button class="fx-btn" id="roomBtn" title="换一个房间">🖼 换景</button>
    <button class="fx-btn" id="objExport" title="导出标注 JSON" style="display:none">💾 导出</button>
  </div>
  <div id="stage">
    <video id="pet" autoplay muted playsinline loop></video>
    <div id="stageFallback">🐟</div>
    <div id="state">待命</div>
    <div id="level"><i></i></div>
  </div>

  <div id="menu">
    <input id="menuSearch" placeholder="搜动作名…" autocomplete="off">
    <div id="menuList"></div>
  </div>

  <div id="log"></div>

  <div id="foot">
    <button id="ptt">按住说话（或按住空格）</button>
    <button id="listen">🎙 检测说话：关</button>
    <div id="hint">松开即发送</div>
  </div>
</div>

<script src="rooms/anchors.js"></script>
<script>
const IDLE = ['anim-058','anim-003','anim-018','anim-101','anim-046','anim-059','anim-061','anim-021','anim-050','anim-082','anim-066','anim-091','anim-106']
const SPEAK = ['anim-086','anim-087','anim-088','anim-076','anim-073']

// 自动检测说话的参数已下移到「自动检测说话」那一节，避免重复声明

const pet = document.getElementById('pet')
const fallback = document.getElementById('stageFallback')
const stateEl = document.getElementById('state')
const levelEl = document.getElementById('level')
const levelBar = levelEl.querySelector('i')
const logEl = document.getElementById('log')
const ptt = document.getElementById('ptt')
const listenBtn = document.getElementById('listen')
const hint = document.getElementById('hint')

let current = null        // 正在播放的音频
let busy = false          // 一轮还没结束
let idleTimer = null
let urlCache = new Map()
let botAnimUntil = 0        // 她自己挑的动作，这段时间内别被待机动画盖掉
let animPollTimer = null

// —— 按住说话 ——
let recording = false
let rec = null
let chunks = []

// —— 自动检测说话 ——
let listening = false
let vadStream = null
let audioCtx = null
let analyser = null
let vadRec = null
let vadTimer = null
let ring = []             // 最近几块（做预录）
let inSpeech = false
let onsetMs = 0
let silenceMs = 0
let uttChunks = []
let uttStart = 0

function setState(t) { stateEl.textContent = t }

async function assetUrl(file) {
  if (urlCache.has(file)) return urlCache.get(file)
  const u = await window.bridge.assetUrl(file)
  urlCache.set(file, u)
  return u
}

async function playAnim(pool) {
  const name = pool[Math.floor(Math.random() * pool.length)] + '.webm'
  const url = await assetUrl(name)
  if (!url) return
  pet.src = url
  pet.play().catch(() => {})
}

function startIdle() {
  stopIdle()
  playAnim(IDLE)
  idleTimer = setInterval(() => { if (!current && Date.now() > botAnimUntil) playAnim(IDLE) }, 9000)
}
function stopIdle() { if (idleTimer) { clearInterval(idleTimer); idleTimer = null } }

pet.addEventListener('error', () => { fallback.style.display = 'flex'; pet.style.display = 'none' })

function addRow(kind, text) {
  const d = document.createElement('div')
  d.className = 'row ' + kind
  d.textContent = text
  logEl.appendChild(d)
  logEl.scrollTop = logEl.scrollHeight
  return d
}

function b64(buf) {
  const bytes = new Uint8Array(buf)
  let s = ''
  const step = 0x8000
  for (let i = 0; i < bytes.length; i += step) s += String.fromCharCode.apply(null, bytes.subarray(i, i + step))
  return btoa(s)
}

function pickMime() {
  return MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm'
}

// ---------- 发一轮 ----------
async function send(blob) {
  if (busy) { hint.textContent = '上一句还没回完，这句先跳过'; return }
  busy = true
  ptt.disabled = true
  setState('她在听…')
  hint.textContent = '转文字中…'
  const buf = await blob.arrayBuffer()
  const t0 = Date.now()
  const r = await window.bridge.turn({ audio: b64(buf), ext: 'webm' })
  busy = false
  ptt.disabled = listening
  if (!r || !r.ok) {
    setState('出错了')
    hint.textContent = r && r.message ? r.message : '失败'
    addRow('sys', '⚠ ' + (r && r.message ? r.message : '失败'))
    return
  }
  if (r.heard) addRow('me', r.heard)
  if (r.reply) addRow('her', r.reply)
  hint.textContent = '用时 ' + ((Date.now() - t0) / 1000).toFixed(1) + 's'
  setState(listening ? '聆听中' : '待命')
  if (r.voice && r.voice.data) playVoice(r.voice.data)
  else playAnim(SPEAK)
}

function playVoice(data) {
  try {
    if (current) { current.pause(); current = null }
    stopIdle()
    const a = new Audio('data:audio/wav;base64,' + data)
    current = a
    a.onplay = () => { setState('说话中'); playAnim(SPEAK) }
    a.onended = () => { current = null; setState(listening ? '聆听中' : '待命'); startIdle() }
    a.onerror = () => { current = null; setState('播放失败'); startIdle() }
    a.play().catch(() => { current = null; startIdle() })
  } catch (error) {
    hint.textContent = '播放失败：' + ((error && error.message) || error)
    startIdle()
  }
}

// ---------- 按住说话 ----------
async function startRec() {
  if (listening) return
  if (recording || busy) return
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } })
    rec = new MediaRecorder(stream, { mimeType: pickMime() })
    chunks = []
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data) }
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop())
      const blob = new Blob(chunks, { type: 'audio/webm' })
      recording = false
      ptt.classList.remove('rec')
      ptt.textContent = '按住说话（或按住空格）'
      if (blob.size < 800) { hint.textContent = '太短了，再说一次'; return }
      await send(blob)
    }
    rec.start()
    recording = true
    ptt.classList.add('rec')
    ptt.textContent = '松开发送…'
    setState('录音中')
    hint.textContent = '正在听…'
  } catch (error) {
    recording = false
    setState('麦克风不可用')
    hint.textContent = '拿不到麦克风：' + ((error && error.message) || error)
  }
}

function stopRec() {
  if (rec && recording) { try { rec.stop() } catch { recording = false } }
}

// ---------- 自动检测说话 ----------
// 每个「句子」单独开一个 MediaRecorder。
// WebM 的 EBML 头只写在第一块里：如果把持续录音的中间几块拼起来，文件头就丢了，
// ffmpeg 会报 "EBML header parsing failed"。所以这里不用拼块，
// 改成「低阈值先开录（拿预录），高阈值才确认真的在说话」。
const ARM_RMS = 0.010        // 低阈值：有点动静就先录着
const ONSET_RMS = 0.020      // 高阈值：确认在说话
const ONSET_MS = 100         // 高阈值持续多久确认
const HANGOVER_RMS = 0.012   // 低于它开始计静音
const HANGOVER_MS = 800      // 静音多久算说完
const ARM_TIMEOUT_MS = 600   // 预备后这么久没确认，丢弃重来
const MIN_SPEECH_MS = 350    // 有效语音下限

let armedAt = 0

async function ensureStream() {
  if (vadStream && vadStream.active) return vadStream
  vadStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  })
  return vadStream
}

function armRecorder() {
  if (vadRec) return
  uttChunks = []
  try {
    vadRec = new MediaRecorder(vadStream, { mimeType: pickMime() })
  } catch (error) {
    hint.textContent = '录音器创建失败：' + ((error && error.message) || error)
    return
  }
  vadRec.ondataavailable = (e) => { if (e.data && e.data.size) uttChunks.push(e.data) }
  vadRec.start(200)
  armedAt = Date.now()
  setState('预备…')
}

function disarmRecorder() {
  const r = vadRec
  vadRec = null
  armedAt = 0
  uttChunks = []
  if (r) { try { r.onstop = null; r.stop() } catch { /* 忽略 */ } }
  setState(listening ? '聆听中' : '待命')
}

function confirmSpeech() {
  inSpeech = true
  silenceMs = 0
  onsetMs = 0
  uttStart = Date.now()
  listenBtn.classList.add('hearing')
  setState('听到你说话了…')
  hint.textContent = '说完停顿一下就自动发送'
}

function finishUtterance() {
  inSpeech = false
  listenBtn.classList.remove('hearing')
  const r = vadRec
  vadRec = null
  armedAt = 0
  const dur = Date.now() - uttStart
  // 注意：这里不能先把 uttChunks 换成新数组。stop() 时会再抛最后一块，
  // ondataavailable 推的还是 uttChunks 这个变量指向的数组——换掉就把尾音弄丢了。
  const parts = uttChunks
  if (!r) { uttChunks = []; return }
  r.onstop = () => {
    uttChunks = []
    if (dur < MIN_SPEECH_MS) { setState(listening ? '聆听中' : '待命'); hint.textContent = '太短了，没发送'; return }
    const blob = new Blob(parts, { type: 'audio/webm' })
    if (blob.size < 1500) { setState(listening ? '聆听中' : '待命'); hint.textContent = '太短了，没发送'; return }
    send(blob)
  }
  try { r.stop() } catch { setState(listening ? '聆听中' : '待命') }
}

function vadTick() {
  if (!analyser) return
  // 她正在想 / 正在放语音时不做检测：否则麦克风会把她自己的声音当我说的话，
  // 一路循环下去（回声消除只是减轻，不能完全避免）。
  if (busy || current) {
    onsetMs = 0
    silenceMs = 0
    if (!inSpeech && vadRec) disarmRecorder()
    levelBar.style.width = '0%'
    return
  }
  const buf = new Uint8Array(analyser.fftSize)
  analyser.getByteTimeDomainData(buf)
  let sum = 0
  for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v }
  const rms = Math.sqrt(sum / buf.length)
  levelBar.style.width = Math.min(100, Math.round((rms / 0.15) * 100)) + '%'

  if (!inSpeech) {
    if (!vadRec) {
      if (rms > ARM_RMS) armRecorder()
      return
    }
    if (rms > ONSET_RMS) {
      onsetMs += 60
      if (onsetMs >= ONSET_MS) confirmSpeech()
    } else {
      onsetMs = 0
      if (Date.now() - armedAt > ARM_TIMEOUT_MS) disarmRecorder()
    }
  } else {
    if (rms > HANGOVER_RMS) silenceMs = 0
    else silenceMs += 60
    if (silenceMs >= HANGOVER_MS) finishUtterance()
  }
}

async function startListen() {
  if (listening) return
  try {
    await ensureStream()
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)()
    if (audioCtx.state === 'suspended') await audioCtx.resume()
    const src = audioCtx.createMediaStreamSource(vadStream)
    analyser = audioCtx.createAnalyser()
    analyser.fftSize = 2048
    analyser.smoothingTimeConstant = 0.4
    src.connect(analyser)

    inSpeech = false
    onsetMs = 0
    silenceMs = 0
    uttChunks = []
    vadRec = null
    vadTimer = setInterval(vadTick, 60)

    listening = true
    ptt.disabled = true
    ptt.textContent = '自动聆听中…（先关掉才能按住说）'
    listenBtn.classList.add('on')
    listenBtn.textContent = '🎙 检测说话：开'
    levelEl.classList.add('on')
    setState('聆听中')
    hint.textContent = '说话就行，停顿一下自动发送'
  } catch (error) {
    listening = false
    setState('麦克风不可用')
    hint.textContent = '开启失败：' + ((error && error.message) || error)
  }
}

function stopListen() {
  if (!listening) return
  listening = false
  if (vadTimer) { clearInterval(vadTimer); vadTimer = null }
  if (vadRec) { try { vadRec.onstop = null; vadRec.stop() } catch { /* 忽略 */ } }
  vadRec = null
  armedAt = 0
  inSpeech = false
  uttChunks = []
  try { if (analyser) analyser.disconnect() } catch { /* 忽略 */ }
  analyser = null
  try { if (vadStream) vadStream.getTracks().forEach((t) => t.stop()) } catch { /* 忽略 */ }
  vadStream = null
  ptt.disabled = false
  ptt.textContent = '按住说话（或按住空格）'
  listenBtn.classList.remove('on', 'hearing')
  listenBtn.textContent = '🎙 检测说话：关'
  levelEl.classList.remove('on')
  levelBar.style.width = '0%'
  setState('待命')
  hint.textContent = '松开即发送'
}
listenBtn.onclick = () => { listening ? stopListen() : startListen() }

  { id: 'w1-warm-wood',    name: '暖木小屋',   night: true,  win: [38, 8, 34, 40], lamps: [[50, 32, 24, 24], [10, 36, 22, 22]], shades: [[51, 30, 10, 9], [11, 34, 9, 8]], rug: [30, 66, 44, 26] },
  { id: 'n1-neon-cyber',   name: '霓虹赛博',   night: true,  win: [42, 6, 50, 50], lamps: [[54, 28, 26, 26], [74, 44, 22, 22]], shades: [[55, 26, 10, 9], [75, 42, 9, 8]], rug: [40, 68, 36, 24] },
  { id: 'l1-bright-nordic',name: '北欧日光',   night: false, win: [44, 4, 32, 40], lamps: [],                       shades: [],                     rug: [32, 66, 40, 26] },

const $ = (id) => document.getElementById(id)
let roomIdx = 0 /* 默认 v2-blue-cozy */
try {
  const saved = Number(localStorage.getItem('room:idx'))
  if (Number.isInteger(saved) && saved >= 0 && saved < ROOMS.length) roomIdx = saved
} catch { /* 忽略 */ }

function place(el, rect) {
  if (!el) return
  if (!rect) { el.style.display = 'none'; return }
  el.style.display = ''
  el.style.left = rect[0] + '%'
  el.style.top = rect[1] + '%'
  el.style.width = rect[2] + '%'
  el.style.height = rect[3] + '%'
}

// 每个房间的锚点：优先用 localStorage 里手动调过的
function anchorsOf(r) {
  const def = {
    win: r.win || null,
    lamp0: r.lamps[0] || null,
    lamp1: r.lamps[1] || null,
    shade0: r.shades[0] || null,
    shade1: r.shades[1] || null,
    rug: r.rug || null,
  }
  try {
    const raw = localStorage.getItem('anchors:' + r.id)
    if (!raw) return def
    const saved = JSON.parse(raw)
    return { ...def, ...saved }
  } catch { return def }
}

function saveAnchors(r, a) {
  try { localStorage.setItem('anchors:' + r.id, JSON.stringify(a)) } catch { /* 忽略 */ }
}

let curAnchors = null

function applyRoom(i) {
  const r = ROOMS[i]
  if (!r) return
  curAnchors = anchorsOf(r)
  const img = $('roomImg')
  if (img) img.src = 'rooms/' + r.id + '.webp'
  place($('fxSnow'), r.night ? curAnchors.win : null)
  place($('fxLampA'), curAnchors.lamp0)
  place($('fxLampB'), curAnchors.lamp1)
  place($('fxShadeA'), curAnchors.shade0)
  place($('fxShadeB'), curAnchors.shade1)
  place($('fxRug'), curAnchors.rug)
  document.body.classList.toggle('room-day', !r.night)
  if (typeof renderObjects === 'function') renderObjects()
  const hintEl = $('hint')
  if (hintEl && !hintEl.dataset.busy) hintEl.textContent = '房间：' + r.name
}

// ---------- 物体标注（调试模式） ----------
const OBJ_EDITS = {}   // roomId -> { objKey: {rect, anchor} }

function objDataOf(roomId) {
  const base = (window.ROOM_ANCHORS && window.ROOM_ANCHORS[roomId]) || { objects: {} }
  const merged = {}
  for (const [k, v] of Object.entries(base.objects || {})) {
    merged[k] = { rect: (v.rect || [0, 0, 10, 10]).slice(), anchor: (v.anchor || [5, 5]).slice() }
  }
  const edits = OBJ_EDITS[roomId] || {}
  for (const [k, v] of Object.entries(edits)) merged[k] = v
  return merged
}

function renderObjects() {
  const layer = $('objLayer')
  if (!layer) return
  layer.innerHTML = ''
  const r = ROOMS[roomIdx]
  const objs = objDataOf(r.id)
  for (const [key, o] of Object.entries(objs)) {
    const box = document.createElement('div')
    box.className = 'objBox'
    box.style.left = o.rect[0] + '%'
    box.style.top = o.rect[1] + '%'
    box.style.width = o.rect[2] + '%'
    box.style.height = o.rect[3] + '%'
    const lbl = document.createElement('span')
    lbl.className = 'lbl'
    lbl.textContent = key
    box.appendChild(lbl)

    const dot = document.createElement('div')
    dot.className = 'objAnchor'
    dot.style.left = o.anchor[0] + '%'
    dot.style.top = o.anchor[1] + '%'
    dot.title = key + ' 落脚点'

    bindObjDrag(box, dot, r.id, key, o, 'rect')
    bindObjDrag(dot, null, r.id, key, o, 'anchor')
    layer.appendChild(box)
    layer.appendChild(dot)
  }
}

function bindObjDrag(el, dot, roomId, key, o, mode) {
  el.addEventListener('pointerdown', (e) => {
    if (!document.body.classList.contains('fx-cal')) return
    e.preventDefault(); e.stopPropagation()
    const room = $('room')
    const rr = room.getBoundingClientRect()
    const sx = e.clientX, sy = e.clientY
    const origRect = o.rect.slice()
    const origAnchor = o.anchor.slice()
    const move = (ev) => {
      const dx = (ev.clientX - sx) / rr.width * 100
      const dy = (ev.clientY - sy) / rr.height * 100
      if (mode === 'anchor') {
        o.anchor[0] = +(origAnchor[0] + dx).toFixed(1)
        o.anchor[1] = +(origAnchor[1] + dy).toFixed(1)
        if (dot) { dot.style.left = o.anchor[0] + '%'; dot.style.top = o.anchor[1] + '%' }
      } else if (ev.shiftKey) {
        o.rect[2] = Math.max(2, +(origRect[2] + dx).toFixed(1))
        o.rect[3] = Math.max(2, +(origRect[3] + dy).toFixed(1))
        el.style.width = o.rect[2] + '%'; el.style.height = o.rect[3] + '%'
        if (dot) { dot.style.left = o.anchor[0] + '%'; dot.style.top = o.anchor[1] + '%' }
      } else {
        o.rect[0] = +(origRect[0] + dx).toFixed(1)
        o.rect[1] = +(origRect[1] + dy).toFixed(1)
        o.anchor[0] = +(origAnchor[0] + dx).toFixed(1)
        o.anchor[1] = +(origAnchor[1] + dy).toFixed(1)
        el.style.left = o.rect[0] + '%'; el.style.top = o.rect[1] + '%'
        if (dot) { dot.style.left = o.anchor[0] + '%'; dot.style.top = o.anchor[1] + '%' }
      }
    }
    const up = () => {
      window.removeEventListener('pointermove', move)
      window.removeEventListener('pointerup', up)
      OBJ_EDITS[roomId] = OBJ_EDITS[roomId] || {}
      OBJ_EDITS[roomId][key] = o
      const info = $('calInfo')
      if (info) info.textContent = calInfoText()
    }
    window.addEventListener('pointermove', move)
    window.addEventListener('pointerup', up)
  })
}

// ---------- 拖动调整（调试模式） ----------
const DRAG_BOXES = [
  ['fxSnow', 'win'], ['fxLampA', 'lamp0'], ['fxLampB', 'lamp1'],
  ['fxShadeA', 'shade0'], ['fxShadeB', 'shade1'], ['fxRug', 'rug'],
]

function bindDrag() {
  const room = $('room')
  if (!room) return
  for (const [id, key] of DRAG_BOXES) {
    const el = $(id)
    if (!el || el.dataset.dragBound) continue
    el.dataset.dragBound = '1'
    el.addEventListener('pointerdown', (e) => {
      if (!document.body.classList.contains('fx-cal')) return
      const v = curAnchors && curAnchors[key]
      if (!v) return
      e.preventDefault()
      e.stopPropagation()
      const rr = room.getBoundingClientRect()
      const sx = e.clientX, sy = e.clientY
      const orig = v.slice()
      let moved = false
      const move = (ev) => {
        const dx = (ev.clientX - sx) / rr.width * 100
        const dy = (ev.clientY - sy) / rr.height * 100
        if (Math.abs(dx) + Math.abs(dy) > 0.3) moved = true
        v[0] = +(orig[0] + dx).toFixed(1)
        v[1] = +(orig[1] + dy).toFixed(1)
        place(el, v)
        const info = $('calInfo')
        if (info) info.textContent = calInfoText()
      }
      const up = () => {
        window.removeEventListener('pointermove', move)
        window.removeEventListener('pointerup', up)
        if (moved) {
          saveAnchors(ROOMS[roomIdx], curAnchors)
          const info = $('calInfo')
          if (info) info.textContent = calInfoText()
        }
      }
      window.addEventListener('pointermove', move)
      window.addEventListener('pointerup', up)
    })
    // Shift + 拖动改变大小
    el.addEventListener('pointerdown', (e) => {
      if (!document.body.classList.contains('fx-cal') || !e.shiftKey) return
      const v = curAnchors && curAnchors[key]
      if (!v) return
      e.preventDefault()
      e.stopPropagation()
      const rr = room.getBoundingClientRect()
      const sx = e.clientX, sy = e.clientY
      const orig = v.slice()
      const move = (ev) => {
        v[2] = Math.max(2, +(orig[2] + (ev.clientX - sx) / rr.width * 100).toFixed(1))
        v[3] = Math.max(2, +(orig[3] + (ev.clientY - sy) / rr.height * 100).toFixed(1))
        place(el, v)
        const info = $('calInfo')
        if (info) info.textContent = calInfoText()
      }
      const up = () => {
        window.removeEventListener('pointermove', move)
        window.removeEventListener('pointerup', up)
        saveAnchors(ROOMS[roomIdx], curAnchors)
      }
      window.addEventListener('pointermove', move)
      window.addEventListener('pointerup', up)
    })
  }
}

  }
}
document.querySelectorAll('.fx-btn').forEach((b) => {
  b.addEventListener('click', () => {
    const k = b.dataset.fx
    const on = localStorage.getItem('fx:' + k) !== '1'
    localStorage.setItem('fx:' + k, on ? '1' : '0')
    applyFx()
  })
})
applyFx()

// ---------- 右键动作菜单 ----------
const menu = document.getElementById('menu')
const menuList = document.getElementById('menuList')
const menuSearch = document.getElementById('menuSearch')
let animItems = []
let animLoaded = false

async function loadAnimList() {
  if (animLoaded) return animItems
  try {
    const r = await window.bridge.animList()
    if (r && r.ok) { animItems = r.items || []; animLoaded = true }
  } catch { /* 后端没起来就空着 */ }
  return animItems
}

function renderMenu(filter) {
  const q = String(filter || '').trim().toLowerCase()
  const items = q ? animItems.filter((x) => x.name.toLowerCase().includes(q) || x.id.includes(q)) : animItems
  menuList.innerHTML = ''
  if (!items.length) {
    const d = document.createElement('div')
    d.className = 'empty'
    d.textContent = animLoaded ? '没有匹配的动作' : '拿不到动作清单（后端没起来？）'
    menuList.appendChild(d)
    return
  }
  const frag = document.createDocumentFragment()
  for (const it of items) {
    const row = document.createElement('div')
    row.className = 'mi'
    const name = document.createElement('span')
    name.textContent = it.name
    const id = document.createElement('span')
    id.className = 'id'
    id.textContent = it.id
    row.appendChild(name)
    row.appendChild(id)
    row.onclick = async () => {
      closeMenu()
      const r = await window.bridge.animSet(it.name).catch(() => null)
      if (r && r.ok) {
        botAnimUntil = Date.now() + 8000
        playAnim([it.id])
        hint.textContent = '换成：' + it.name
        setState('换动作')
      } else {
        hint.textContent = '没换成：' + ((r && r.message) || '未知原因')
      }
    }
    frag.appendChild(row)
  }
  menuList.appendChild(frag)
}

function openMenu(x, y) {
  menu.classList.add('open')
  menuSearch.value = ''
  loadAnimList().then((list) => { renderMenu(''); hint.textContent = list.length ? '挑一个动作' : '' })
  // 摆位：别超出窗口边界
  const rect = menu.getBoundingClientRect()
  const w = rect.width || 262
  const h = rect.height || 300
  const maxX = window.innerWidth - w - 6
  const maxY = window.innerHeight - h - 6
  menu.style.left = Math.max(6, Math.min(x, maxX)) + 'px'
  menu.style.top = Math.max(6, Math.min(y, maxY)) + 'px'
  menuSearch.focus()
}

function closeMenu() { menu.classList.remove('open') }

menuSearch.addEventListener('input', () => renderMenu(menuSearch.value))
menuSearch.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeMenu()
  if (e.key === 'Enter') { const first = menuList.querySelector('.mi'); if (first) first.click() }
})
document.addEventListener('click', (e) => { if (!menu.contains(e.target)) closeMenu() })

// 右键形象（或整个舞台）弹菜单
for (const node of [pet, document.getElementById('stage')]) {
  node.addEventListener('contextmenu', (e) => {
    e.preventDefault()
    openMenu(e.clientX, e.clientY)
  })
}

// ---------- 她挑的动作 ----------
// 后端模块给她注册了 whale_anim 工具；她一旦调用，这里轮询到就切过去播。
async function pollBotAnim() {
  try {
    const r = await window.bridge.animPoll()
    if (r && r.ok && r.anim && r.anim.id) {
      const name = r.anim.name || r.anim.id
      hint.textContent = '她换了个动作：' + name
      botAnimUntil = Date.now() + 8000
      playAnim([r.anim.id])
      setState('她换动作了')
      setTimeout(() => { if (!current) setState(listening ? '聆听中' : '待命') }, 1500)
    }
  } catch { /* 后端没起来就安静跳过 */ }
  animPollTimer = setTimeout(pollBotAnim, 900)
}

// ---------- 启动 ----------
;(async () => {
  startIdle()
  pollBotAnim()
  hint.textContent = '松开发送 · 右键形象挑动作'
  const s = await window.bridge.status().catch(() => null)
  if (s && s.ok) setState('待命')
  else hint.textContent = '连不上 Aurabot 的 voice-lab 模块'
})()
// RESET_HOTKEY：调试模式按 R 重置本房间锚点
window.addEventListener('keydown', (e) => {
  if (!document.body.classList.contains('fx-cal')) return
  if (e.key !== 'r' && e.key !== 'R') return
  const r = ROOMS[roomIdx]
  try { localStorage.removeItem('anchors:' + r.id) } catch { /* 忽略 */ }
  applyRoom(roomIdx)
  bindDrag()
  const info = $('calInfo')
  if (info) info.textContent = calInfoText()
})

// CAL_HOOK：?cal=1 直接进调试模式
if (location.search.indexOf('cal=1') >= 0) setTimeout(toggleCal, 400)
</script>
